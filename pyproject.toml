[project]
name = "dotfit"
version = "0.1.0"
description = "Local .fit archive with bidirectional Garmin/Strava sync"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "garminconnect>=0.2.19",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2",
    "pydantic-settings>=2",
    "tenacity>=8",
    "fitparse>=0.6",
]

[project.scripts]
dotfit = "dotfit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dotfit"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
browser = [
    "browser-cookie3>=0.12",
]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]
